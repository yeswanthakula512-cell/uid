            } 
            input {

       </style> 
    </head> 
    <body> 
        <h1><i>Real-Time Username Validation (Minimum 5 Characters)</i></h1> 
        <div> 
             UserName:<input type="text" id="name" placeholder="Enter the username" onkeyup="validate()"><br> 
             <p id="msg"></p> 
        </div> 
        <script> 
            function validate(){ 
                let value=document.getElementById("name").value; 
                if(value.length<5){ 
                    document.getElementById("msg").innerHTML="Minimum 5 characters required"; 
                    document.getElementById("msg").style.color="red"; 
                } 
                else{ 
                    document.getElementById("msg").innerHTML="Valid Input"; 
                    document.getElementById("msg").style.color="green"; 
                } 
            } 
        </script> 
 
    </body> 
</html>
